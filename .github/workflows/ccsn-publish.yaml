name: Publish verified CCSN ztunnel

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful CCSN build workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          metadata="$(gh api repos/the-ccsn/ztunnel/actions/runs/$BUILD_RUN_ID)"
          jq -e '.conclusion == "success" and .path == ".github/workflows/ccsn-build.yaml"' <<< "$metadata"
          revision="$(jq -r .head_sha <<< "$metadata")"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
  publish:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ztunnel-1.31.1-ccsn-chacha20-${{ matrix.arch }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified architecture image
        env:
          SOURCE_REVISION: ${{ needs.source.outputs.revision }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker load -i "ztunnel-$ARCH.tar"
          docker run "ztunnel:1.31.1-ccsn-chacha20-$ARCH" version
          image="ghcr.io/the-ccsn/ztunnel:1.31.1-ccsn-chacha20-$SOURCE_REVISION-$ARCH"
          docker tag "ztunnel:1.31.1-ccsn-chacha20-$ARCH" "$image"
          docker push "$image"
  manifest:
    needs: [source, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        env:
          SOURCE_REVISION: ${{ needs.source.outputs.revision }}
        run: |
          set -euo pipefail
          image="ghcr.io/the-ccsn/ztunnel:1.31.1-ccsn-chacha20-$SOURCE_REVISION"
          docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
          docker buildx imagetools inspect "$image"
          printf 'Published `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
